    <script>
        let globalWaveObserver;
        let scrollDirection = 'down';
        let lastScrollY = window.scrollY;

        function refreshWaveObserver() {
            // Force reset any nodes before animation
            document.querySelectorAll('.wave-card-node').forEach(node => {
                node.classList.remove('wave-animate');
            });

            if (globalWaveObserver) globalWaveObserver.disconnect();

            // Use GSAP ScrollTrigger for true parallax cards
            if (typeof gsap !== 'undefined' && typeof ScrollTrigger !== 'undefined') {
                // Kill existing ScrollTriggers on wave-card-node to prevent duplicate overlays on resize
                ScrollTrigger.getAll().forEach(trigger => {
                    if (trigger.trigger && trigger.trigger.classList && trigger.trigger.classList.contains('wave-card-node')) {
                        trigger.kill();
                    }
                });

                document.querySelectorAll('.wave-card-node').forEach((card, index) => {
                    // Set initial state
                    gsap.set(card, { opacity: 0, y: 70, transformPerspective: 1000, rotateX: -10 });

                    // Parallax ScrollTrigger animation
                    gsap.to(card, {
                        opacity: 1,
                        y: 0,
                        rotateX: 0,
                        duration: 0.8,
                        ease: "power3.out",
                        scrollTrigger: {
                            trigger: card,
                            start: "top 95%",
                            end: "bottom 15%",
                            scrub: 0.8, // ties scroll position to animation progress for true parallax
                            toggleActions: "play none none none"
                        }
                    });
                });
                return;
            }

            // Fallback: standard IntersectionObserver
            const waveCards = document.querySelectorAll('.wave-card-node');
            const observerOptions = {
                root: null,
                threshold: 0.01,
                rootMargin: "0px 0px -10px 0px"
            };

            globalWaveObserver = new IntersectionObserver((entries) => {
                const entering = entries.filter(e => e.isIntersecting);

                if (entering.length > 0) {
                    entering.forEach((entry, index) => {
                        if (!entry.target.classList.contains('wave-animate')) {
                            entry.target.classList.add('wave-animate');
                            globalWaveObserver.unobserve(entry.target);
                        }
                    });
                }
            }, observerOptions);

            waveCards.forEach(card => globalWaveObserver.observe(card));
        }

        window.addEventListener('scroll', () => {
            const currentScrollY = window.scrollY;
            if (currentScrollY > lastScrollY) {
                scrollDirection = 'down';
            } else if (currentScrollY < lastScrollY) {
                scrollDirection = 'up';
            }
            lastScrollY = currentScrollY;
        });

        function trackScrollHeaderAmbulance() {
            const ambulance = document.getElementById('headerAmbulance');
            const shield = document.getElementById('headerShieldReaction');
            if (!ambulance) return;
            const scrollTop = window.scrollY || document.documentElement.scrollTop;
            const docHeight = document.documentElement.scrollHeight - window.innerHeight;
            const scrollPercent = docHeight > 0 ? (scrollTop / docHeight) * 100 : 0;
            // Prevent going out of screen boundaries
            ambulance.style.left = `calc(${scrollPercent}% - ${56 * (scrollPercent / 100)}px)`;

            // Pop shield sign reaction when ambulance reaches the end
            if (shield) {
                if (scrollPercent >= 98) {
                    shield.classList.add('scale-110', 'opacity-100', 'translate-y-0');
                    shield.classList.remove('scale-0', 'opacity-0', 'translate-y-2');
                } else {
                    shield.classList.remove('scale-110', 'opacity-100', 'translate-y-0');
                    shield.classList.add('scale-0', 'opacity-0', 'translate-y-2');
                }
            }
        }
        window.addEventListener('scroll', trackScrollHeaderAmbulance);
        window.addEventListener('resize', trackScrollHeaderAmbulance);
